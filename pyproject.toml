[project]
name = "end-outbreak-superspreading-delays"
version = "0.1.0"
description = "End-of-outbreak decision-making under superspreading and onset-date delays"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pymc>=6.0",
    "arviz>=0.18",
    # arviz stores InferenceData with groups, so save_fit writes NETCDF4, which needs an
    # HDF5 backend. Without one the tier-1 -> tier-2 handoff fails at the first save_fit.
    "h5netcdf>=1.3",
    "pyyaml>=6.0",
    # The RAC step runs one fit per conditioning day and spreads them over worker processes
    # (end_of_outbreak/parallel.py). joblib's loky backend is what makes that safe: it reuses
    # its workers across the ~110 fits and can pin each one to a single BLAS thread, which
    # `concurrent.futures` cannot do once NumPy is imported.
    "joblib>=1.3",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["end_of_outbreak"]

# ---------------------------------------------------------------------------
# pixi configuration
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
# conda-forge first (higher priority); bioconda supplies Snakemake and its Slurm executor.
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.dependencies]
# The upper bound is gone now that the pipeline no longer asks `pm.sample` for more than one
# process: chain-level multiprocessing forks an already-multi-threaded interpreter, which is
# what 3.13 deprecates and 3.14 moves away from. `fitting.fit_model` samples with `cores=1` and
# the parallelism lives in `end_of_outbreak/parallel.py` instead.
#
# Verified rather than assumed: the full suite passes on 3.14.6, and an unbounded solve keeps
# every numerical package at the version locked here -- pymc 6.2.0, pytensor 3.2.4, numpy 2.4.6,
# scipy 1.18.0, arviz 1.2.0 -- so moving up does not drag the scientific stack with it. The lock
# is deliberately left on 3.13 until someone runs `pixi update python`; relaxing the constraint
# and changing the interpreter are separate decisions, and the second one invalidates nothing
# but should not happen in the middle of a cluster run.
python = ">=3.12"
numpy = ">=2.0"
scipy = ">=1.13"
pandas = ">=2.0"
matplotlib = ">=3.8"
pymc = ">=6.0"
arviz = ">=0.18"
h5netcdf = ">=1.3"
pyyaml = ">=6.0"
joblib = ">=1.3"
tqdm = ">=4.66"

# PyTensor compiles small C extensions at runtime. Conda clang 21 misroutes its ``-ld64``
# compatibility flag on current macOS; clang 22 handles the same link command correctly.
[tool.pixi.target.osx-arm64.dependencies]
clangxx = ">=22"

[tool.pixi.pypi-dependencies]
end-outbreak-superspreading-delays = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
pytest = "*"
snakemake = ">=9.25"
snakemake-executor-plugin-slurm = ">=2.7"

[tool.pixi.feature.dev.pypi-dependencies]
ruff = "*"
ty = "*"

[tool.pixi.environments]
default = { features = ["dev"] }

[tool.pixi.tasks]
fmt = "ruff format end_of_outbreak scripts validation tests"
lint = "ruff check end_of_outbreak scripts validation tests"
typecheck = "env -u VIRTUAL_ENV ty check end_of_outbreak scripts validation tests"
test = "pytest"
check = { depends-on = ["fmt", "lint", "typecheck", "test"] }
pipeline = "snakemake --profile config/snakemake_profile -j4"
pipeline-dry = "snakemake --profile config/snakemake_profile -n"
# After pulling the cluster's completed `results` target, render presentation artefacts only.
# The allowlist is load-bearing: compute rules do not enter the DAG even if local provenance
# says their existing outputs are stale.
pipeline-present = "snakemake --profile config/snakemake_profile -j4 figures report/report.pdf --allowed-rules figures schematic_figure delay_figure figure sustained_transmission_figure underreporting_figure report"
pipeline-present-dry = "snakemake --profile config/snakemake_profile -n figures report/report.pdf --allowed-rules figures schematic_figure delay_figure figure sustained_transmission_figure underreporting_figure report"
# The exploratory no-switchpoint variants. A separate task because they are not in `rule all`:
# nothing builds them unless they are named.
pipeline-no-switch = "snakemake --profile config/snakemake_profile -j4 no_switch"
pipeline-no-switch-dry = "snakemake --profile config/snakemake_profile -n no_switch"
# After pulling a cluster run of `no_switch_results`, draw the two figures and nothing else.
# The allowlist plays the same role as `pipeline-present`'s: pulled curves are immutable
# inputs, and local provenance would otherwise call them stale and refit them.
pipeline-no-switch-present = "snakemake --profile config/snakemake_profile -j4 no_switch --allowed-rules no_switch no_switch_results no_switch_figure"
# The anchoring comparison with superspreading removed (`cori` vs `cori_so`), likewise outside
# `rule all`. Its cluster half is `no_superspreading_results`, which carries the evidence as
# well as the curves -- though at 220 fits with no latent block it is also a laptop job.
pipeline-no-superspreading = "snakemake --profile config/snakemake_profile -j4 no_superspreading"
pipeline-no-superspreading-dry = "snakemake --profile config/snakemake_profile -n no_superspreading"
pipeline-no-superspreading-present = "snakemake --profile config/snakemake_profile -j4 no_superspreading --allowed-rules no_superspreading no_superspreading_results no_superspreading_figure"

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# N802/N803/N806: lower-case function / argument / variable names. The
# mathematical notation of the implementation plan (R_pre, F_r, Y, Lambda, C_t)
# is deliberately preserved in identifiers. N999: module filenames may carry the
# same capitalisation.
# RUF001/RUF002/RUF003: "ambiguous" unicode. Docstrings and comments in this
# project are prose about an epidemiological analysis and deliberately use
# typographic characters -- en dashes in date and page ranges, accents in
# Équateur, and mathematical symbols such as Λ and ≥.
ignore = ["N802", "N803", "N806", "N999", "RUF001", "RUF002", "RUF003"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
