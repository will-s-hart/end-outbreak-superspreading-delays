# Pipeline configuration.
#
# Structured per analysis so that Snakemake's `params` rerun-trigger stays fine-grained:
# tweaking the `k` prior for the estimated-k analyses must not invalidate the fixed-k fits.
# Anything genuinely common to all four analyses lives under `shared`.

shared:
  data_file: data/equateur_2018_onsets.csv

  # The analysis window and the ERT's arrival and withdrawal dates are facts about the
  # outbreak, not settings: they live beside the onset dates in `end_of_outbreak/outbreak_data`
  # (days 33 and 110, i.e. 8 May and 24 July 2018), which is also where the report reads them
  # from. The day a model *switches* R is the modelling choice, and defaults to the arrival
  # day; override it per analysis with `switch_day` (§5.7 of the implementation plan).

  # Delay distributions. `serial_interval` drives all five models; `incubation_period` and
  # the residual TOST drive the two onset-anchored ones.
  #
  # serial_interval: generic EVD estimate, Van Kerkhove et al. (2015) Sci Data 2:150019,
  #   as used in the main analyses of Thompson et al. (2024).
  # incubation_period: WHO Ebola Response Team (2014) NEJM 371:1481-1495.
  # The TOST is not configured directly: it is the gamma carrying the residual mean and
  # variance (delay_distributions.check_delay_budget), here mean 3.9 d, SD 4.57 d.
  serial_interval:
    name: generic_evd
    mean: 15.3
    sd: 9.3
  incubation_period:
    name: who_ert_2014
    mean: 11.4
    sd: 8.1
  max_lag: 110  # = the analysis window, so nothing is truncated within it
  serial_interval_tolerance: 0.02  # max TV distance of f_tost * f_inc from w

  # Alternative serial interval for the sensitivity analysis (§2, Stage 10). Not admissible
  # for the onset-anchored models alongside the incubation estimate above: its variance
  # (36.97) is smaller than the incubation variance (65.61).
  serial_interval_outbreak_specific:
    name: equateur_2018
    mean: 19.46
    sd: 6.08

  # Priors, identical across models within an analysis so that posterior model
  # probabilities are well-defined Bayes factors (§6.2).
  priors:
    R_pre: {distribution: lognormal, median: 1.0, quantile_025: 0.2}
    R_post: {distribution: lognormal, median: 1.0, quantile_025: 0.2}

analyses:
  naive_models_fixed_k:
    models: [dlo, sse, ssi]
    fixed_k: 0.18  # Althaus-style individual-level estimate, doi:10.1016/S1473-3099(15)70135-0
    run_script: scripts/run_naive_models_fixed_k.py
    plot_script: scripts/plot_naive_models_fixed_k.py
    sampler: {draws: 2000, tune: 2000, chains: 4, target_accept: 0.9, seed: 20260805}

  # The `k` prior is centred on the literature value but a decade wide on each side of it, and
  # it is the same prior in both estimated-`k` analyses. An earlier, informative prior (95%
  # interval 0.09-0.36) left the onset-anchored `k` posteriors sitting on its median, which
  # could have been the data or the prior; at this width a posterior that merely tracks the
  # prior shows itself by being as wide as it is. The narrower prior is not kept anywhere.
  #
  # `target_accept` is 0.99 in both, against 0.9-0.95 elsewhere, and the raise is forced by the
  # prior rather than chosen. Widening `k` puts real prior mass at small `k`, where the
  # offspring distribution is heavy-tailed and the latent block's geometry is awkward; `k` is
  # Slice-sampled (see AGENTS.md on the compound sampler), so the prior reaches NUTS only
  # through which `k` it visits. At 0.95 the onset analysis's conditioning-day refits diverged
  # badly enough to fail `rac.convergence`: 649/937/2611 divergences for ssi/ssi_so/sse_so, with
  # six days over the 1% gate. At 0.99, ssi fell to 14 divergences and passed, for 28% more
  # time. Measured 2026-09-21, not assumed. Naive SSI is the same model as the onset analysis's
  # SSI, so the naive analysis takes the same setting rather than rediscovering the failure. A
  # gamma prior was tried as an alternative and is worse: its lower tail goes as `k**shape`,
  # heavier in log space than the log-normal's, so it puts *more* mass where the trouble is.
  naive_models_estimated_k:
    models: [dlo, sse, ssi]
    fixed_k: null
    k_prior: {distribution: lognormal, median: 0.18, quantile_025: 0.018, quantile_975: 1.8}
    run_script: scripts/run_naive_models_estimated_k.py
    plot_script: scripts/plot_naive_models_estimated_k.py
    sampler: {draws: 2000, tune: 2000, chains: 4, target_accept: 0.99, seed: 20260806}

  onset_models_fixed_k:
    models: [sse, ssi, sse_so, ssi_so]
    fixed_k: 0.18
    run_script: scripts/run_onset_models_fixed_k.py
    plot_script: scripts/plot_onset_models_fixed_k.py
    sampler: {draws: 2000, tune: 2000, chains: 4, target_accept: 0.9, seed: 20260807}

  # The same wide `k` prior and the same `target_accept` as `naive_models_estimated_k`, for the
  # reasons given there.
  onset_models_estimated_k:
    models: [sse, ssi, sse_so, ssi_so]
    fixed_k: null
    k_prior: {distribution: lognormal, median: 0.18, quantile_025: 0.018, quantile_975: 1.8}
    run_script: scripts/run_onset_models_estimated_k.py
    plot_script: scripts/plot_onset_models_estimated_k.py
    sampler: {draws: 2000, tune: 2000, chains: 4, target_accept: 0.99, seed: 20260808}

  # Exploratory, and deliberately out of IMPLEMENTED_ANALYSES: no report figure, no report
  # number. Every measurement of the naive-versus-onset-anchored difference elsewhere is made
  # in models that also carry superspreading. This removes superspreading entirely — `cori` and
  # `cori_so` are the k → ∞ Poisson limits of the two mechanisms — and asks whether the
  # difference survives. What is left is one anchoring convention against the other, with
  # nothing else varying.
  #
  # Keep `cori` *before* `cori_so`. Each model's seed stream is its index in `models`
  # (`AnalysisSetting.model_entropy`), so reordering them would silently change every draw of
  # the curves that were already here. Naive first, matching `onset_models_fixed_k`.
  #
  # **No `fixed_k`, no `k_prior`, and deliberately not even `fixed_k: null`.** These models have
  # no dispersion parameter for a value to attach to: `pymc_models._validate_dispersion` refuses
  # a `k` wherever the specification has none, so either key would fail at the first fit — and
  # `fixed_k: null` means "estimated under `k_prior`" in every other block above, so writing it
  # here would mislead. `AnalysisSetting.dispersion()` returns `None` for exactly this shape.
  #
  # `evidence` applies and `dispersion` does not. The two models share the `R` priors, so the
  # Bayes factor is well defined; with two free scalars and no latent block it is also the
  # cheapest evidence in the project. There is no `k` posterior to summarise, so no rule asks
  # for a `dispersion_posteriors.json` (`estimates_dispersion` in the Snakefile).
  #
  # `target_accept: 0.9`, not the 0.95 the estimated-`k` analyses use: 0.95 is there for the
  # hard `k`/latent geometry, and these posteriors — two free scalars, no latents, no `k` — are
  # the easiest in the project. No `thin:`, so the saved fit stays unthinned and
  # `reuses_final_day_fit` holds, which is what keeps the curve's last day and the evidence file
  # on one posterior. The ERT-arrival switchpoint stays: this analysis is about anchoring, not
  # about the switch, which the two variants below are for.
  onset_models_no_superspreading:
    models: [cori, cori_so]
    run_script: scripts/run_onset_models_no_superspreading.py
    sampler: {draws: 2000, tune: 2000, chains: 4, target_accept: 0.9, seed: 20260921}

  # Exploratory, and deliberately out of IMPLEMENTED_ANALYSES: no report figure, no report
  # number. They ask how much of the naive/onset gap in Analysis 3 is the switchpoint, by
  # removing it. `switch_day: 111` is past the end of the 111-day window, so `switch_index`
  # leaves R_pre in force on every day, in each model's own time index.
  #
  # Both therefore drop the reset counterfactual too: with R constant, RAC's reset to R_pre is
  # a no-op and the estimand is a plain forward predictive rather than a reset predictive.
  # That is the point of the comparison, not an oversight, and the figures say so.
  #
  # Under `no_switch_fixed_R` nothing at all is estimated but the latents, so SSE — fixed k,
  # fixed R, no latent block — has no free variable and its posterior is a point mass. Under
  # `no_switch_single_R`, R_post is still declared but reaches no day, so it returns its prior
  # and is never plotted; a single estimated R is exactly R_pre.
  no_switch_fixed_R:
    models: [sse, ssi, sse_so, ssi_so]
    fixed_k: 0.18
    fixed_R_pre: 0.95
    fixed_R_post: 0.95
    switch_day: 111
    run_script: scripts/run_no_switch_fixed_R.py
    sampler: {draws: 2000, tune: 2000, chains: 4, target_accept: 0.9, seed: 20260916}

  no_switch_single_R:
    models: [sse, ssi, sse_so, ssi_so]
    fixed_k: 0.18
    switch_day: 111
    run_script: scripts/run_no_switch_single_R.py
    sampler: {draws: 2000, tune: 2000, chains: 4, target_accept: 0.9, seed: 20260917}

  # Under-reporting, at the fixed k of Analysis 3 so that the sweep isolates reporting alone
  # and its 100% rung *is* that analysis. The naive models are run too, so the figure can show
  # whether the naive/onset gap survives the reporting assumption.
  #
  # Keep the naive models *after* the onset-anchored ones. Each model's seed stream is its index
  # in `models` (`AnalysisSetting.model_entropy`), so inserting them first would silently change
  # every draw of the curves that were already here.
  #
  # `reporting.probability` is a fixed input, not a parameter. It is not identified from these
  # data without an external prior, so the figure is deliberately a sweep over assumed values.
  # A `delay: {mean, sd}` block would add onset-to-report delays, which the package supports and
  # tests; no analysis uses one, because there are no reporting dates for Equateur.
  #
  # The per-analysis `rac.first_day` starts the curves at the ERT's arrival. Before it the
  # outbreak is growing and the risk is 1 to several decimal places, so the ~32 conditioning
  # days it saves per model are hours of MCMC for nothing.
  #
  # These are the only analyses whose sampler budget is not the default 2000/2000, because they
  # are the only ones with a discrete block: the unreported counts get Metropolis, which mixes
  # far more slowly than NUTS does on everything else. At 2000/2000 SSE fails the R-hat gate
  # outright (day 82 at 60%: R-hat 1.047, bulk ESS 96), and everything else passes only just —
  # worst 1.019 for SSI and 1.016 for the onset-anchored pair, against a threshold of 1.02. So
  # the budget goes up for the whole analysis rather than for the model that happened to cross
  # the line. Tuning is what buys the mixing, not draws alone: at 8000 draws, R-hat on that day
  # is 1.012 after 2000 tuning steps and 1.003 after 4000. R_pre and R_post were never the
  # problem — they sit at 1.001, and only the unreported counts are bad.
  #
  # `thin: 5` applies to the SAVED fit only, never to sampling or to the daily refits behind a
  # curve. Those 8000 draws of four per-day latent arrays make a 113 MB file, past GitHub's
  # 100 MB limit; one draw in five brings it to 8 MB. The trade is lopsided in our favour here
  # because the arrays that fill the file are the ones that mix worst — integrated
  # autocorrelation time near 16 draws, so a fifth of the draws keep four fifths of the ESS.
  # Only these two analyses are thinned: they compute no model evidence, so no Bayes factor
  # depends on the well-mixing scalars that thinning does cost. A thinned fit is also not
  # reused as the curve's last conditioning day -- that day is refit like any other, so the
  # curve's Monte-Carlo error stays uniform and thinning cannot leak into a quoted number.
  # What thinning does reach is the R_pre and R_post intervals report_numbers reads from the
  # archive.
  underreporting_60:
    models: [sse_so, ssi_so, sse, ssi]
    fixed_k: 0.18
    reporting: {probability: 0.6}
    rac: {first_day: 33}
    run_script: scripts/run_underreporting_60.py
    sampler: {draws: 8000, tune: 4000, chains: 4, target_accept: 0.9,
              seed: 20260811, thin: 5}

  underreporting_80:
    models: [sse_so, ssi_so, sse, ssi]
    fixed_k: 0.18
    reporting: {probability: 0.8}
    rac: {first_day: 33}
    run_script: scripts/run_underreporting_80.py
    sampler: {draws: 8000, tune: 4000, chains: 4, target_accept: 0.9,
              seed: 20260812, thin: 5}

# How the risk of additional cases is estimated. RAC(t) conditions on the record through day t
# and nothing after it, so the honest estimator refits the model to counts[:t+1] for every
# conditioning day. That is `refit_daily`, and it is what every figure and report number rests on.
#
# `single_fit_filtered` keeps the parameters from one fit to the whole record and re-derives only
# the latents with a particle filter. It is an approximation on two counts -- the parameters see
# all 111 days, and conditioning the latents on less data than the parameters ignores their
# posterior correlation -- and it is here as the fast route for prototyping a new analysis and as
# the comparison in validation/run_rac_validation.py. Do not publish from it.
#
# Like `latent_parameterisation`, this is a property of the implementation rather than of any one
# analysis, so it sits outside the per-analysis blocks.
rac:
  method: refit_daily
  first_day: 1  # day 0 is an initial condition and carries no likelihood term
  filtering:
    n_draws: 1000     # parameter draws the filter is run at, thinned within chains
    n_particles: 500  # per draw; the filter is fully adapted, so it needs no tuning

  # Acceptance criteria for the ~110 fits behind each curve. A hundred and ten fits is a hundred
  # and ten chances for one to go quietly wrong, so every one is checked -- but note that the
  # thresholds are applied to a *maximum* over roughly 110 fits x 60 variables, which is a far
  # stronger demand than the same number applied to a single fit.
  #
  # `on_failure` is the knob that matters in practice:
  #
  #   warn   the curve and its diagnostics are written either way, and the offending days are
  #          printed. Use this while exploring: refusing to write a curve that has already been
  #          computed, because two days out of a hundred and ten were marginal, costs an hour
  #          and tells you nothing the diagnostics file does not.
  #   error  the step fails. Use this once a configuration is known to pass, so that the gate
  #          becomes a regression test on the sampling rather than a discovery tool.
  #
  # The curve is written and identical under both, so this block is deliberately kept out of the
  # Snakemake rerun triggers (see `analysis_params` in the Snakefile).
  #
  # Calibrated against a complete run of 1540 fits (14 model/analysis pairs x 110 days):
  #
  #   max R-hat over every variable of every fit  1.0100   (one day: SSE-SO, estimated k, day 74)
  #   days above 1.005                            34
  #   divergences, total                          172 of 12.32M draws
  #   divergences, worst single day               22   (the criterion fires at 80)
  #   min bulk ESS                                1143
  #
  # 1.02 is roughly double the observed maximum, which is the headroom a *maximum* over ~1540
  # fits x ~60 variables needs: at 1.01 the run failed on a single day reading exactly 1.0100
  # with no divergences, which is sampling noise on the hardest model rather than a fit that did
  # not converge. Anything genuinely broken -- a stuck chain -- lands far above this, not just
  # over it. Raise `max_r_hat` only with the same kind of evidence; if a *pattern* of days starts
  # creeping up, that is the sampler telling you something and the fix is upstream.
  convergence:
    max_r_hat: 1.02
    divergence_fraction: 0.01
    on_failure: error

# Latent-variable parameterisation, chosen by the Stage-3 sampler benchmark (see
# validation/results/sampler_benchmark.md for the comparison this rests on). Scripts must pass this
# explicitly -- end_of_outbreak.pymc_models refuses to build a latent model without one.
latent_parameterisation: marginalised_inverse_cdf

# Days whose TOST-weighted onset sum lambda_t falls below this are dropped from the SSE-SO
# latent block, with E_t set to 0, at a cost bounded by max(R) * sum(dropped lambda_t).
#
# Stage 3's answer is that the threshold is not needed. The pathological latents -- 52 of
# SSE-SO's 110, with Gamma shapes down to 2.7e-6 -- are exactly the ones the data constrain
# only through exp(-sum_j mu_j), because no day with a case follows them. Those are
# conditionally independent of everything else and are integrated out in *closed form* by the
# `marginalised` parameterisation, at no cost in accuracy at all. Every latent that survives
# has lambda_t >= 0.136, so no defensible threshold would remove any of them.
#
# Kept as a knob (and tested) because it is the fallback if a future dataset leaves a
# pathological latent that is genuinely coupled to the data, which marginalisation cannot
# touch. 0.0 drops nothing.
negligible_latent_threshold: 0.0
